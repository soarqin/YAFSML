name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify version consistency
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Check src/CMakeLists.txt
          $cmakeContent = Get-Content src/CMakeLists.txt -Raw
          if ($cmakeContent -notmatch [regex]::Escape("set(YAFSML_VERSION `"$version`")")) {
            Write-Error "Version mismatch: src/CMakeLists.txt does not contain version $version"
            exit 1
          }

          # Check CHANGELOG.md
          $changelogContent = Get-Content CHANGELOG.md -Raw
          if ($changelogContent -notmatch "(?m)^## \[$([regex]::Escape($version))\] - \d{4}-\d{2}-\d{2}\r?$") {
            Write-Error "Version mismatch: CHANGELOG.md does not contain entry for $version"
            exit 1
          }

          Write-Output "Version $version is consistent across all files."

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      # Like every Release build, this links the dynamic CRT, which the games
      # already load.
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 18 2026" `
            -T v142

      # The dist target builds both binaries and writes the same
      # YAFSML-X.Y.Z.zip/.7z as a local build to build/dist.
      - name: Build and package
        shell: pwsh
        run: |
          cmake --build build --config Release --target dist

      - name: Extract changelog for this version
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $content = Get-Content CHANGELOG.md -Raw

          # Extract the section for this version up to the next release section.
          if ($content -match "(?ms)^## \[$([regex]::Escape($version))\] - \d{4}-\d{2}-\d{2}\r?\n(.*?)(?=^## |\z)") {
            $notes = $matches[1].Trim()
          } else {
            $notes = "See CHANGELOG.md for details."
          }

          # Write to a temp file to avoid multiline issues with GITHUB_OUTPUT
          $notes | Out-File -FilePath release_notes.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.txt
          files: |
            build/dist/YAFSML-${{ steps.version.outputs.version }}.zip
            build/dist/YAFSML-${{ steps.version.outputs.version }}.7z
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
