; YAFSML configuration
; Boolean values accept: true, yes, on, or 1. Any other value is false.

; Game selected by the standalone launcher when --launch-target is not used.
; Accepted values include: eldenring, armoredcore6, nightreign, sekiro, darksouls3, and their aliases.
game=eldenring


; Common patches for games
[patch]
; Skip the intro logo.
skip_intro=1

; Prevent a mod-provided regulation.bin from being written to saves.
; The vanilla file keeps the game's normal save behavior.
prevent_regulation_save_write=1

; Replace the Dantelion allocator with mimalloc. Armored Core VI and Nightreign do not support this patch.
patch_mem=1

; Use a dedicated mimalloc heap for the Dantelion allocator. Disabled uses the
; regular mimalloc allocation functions.
patch_mem_dedicated_heap=0

; Dedicated mimalloc heap size in MB. 0 uses the game-specific default.
patch_mem_heap_size=0

; Cache decrypted BHD headers to reduce archive startup time.
boot_boost=1

; Neutralize Arxan after its entry stub completes. Dark Souls III always enables this.
disable_arxan=0

; Save filename mappings apply to the selected game. A leading dot replaces only
; the source filename extension; empty text disables each mapping.
replace_save_filename=
replace_seamless_coop_save_filename=

; Keep IME enabled in supported games. Elden Ring, Armored Core VI, Nightreign, and Dark Souls III
; also allow non-Latin software-keyboard text; Sekiro only preserves IME.
; Restart after changing this option.
enable_ime=0


; Common tweaks for games
[tweak]
; CPU affinity strategy for the game process.
;  0 = leave the current affinity unchanged
;  1 = all logical cores except the first
;  2 = all efficient cores (Intel 12th gen and newer)
;  3 = all performance cores (Intel 12th gen and newer)
;  4 = all performance cores except the first logical core
; Strategies 1-4 are applied asynchronously once the title menu has been built.
; This is earlier than the point `data_ready` DLLs wait for.
; Unsupported processor-group layouts or an empty mask leave affinity unchanged.
; WARNING: do not use 2 / 3 / 4 for Intel Ultra series CPU on ELDEN RING 1.16.2 or higher!
cpu_affinity=0


; Log settings
[log]
; Show a debug console for logging.
console=0

; log to file
log_file=0

; Minimum log level: trace, debug, info, warn, error, or off.
log_level=warn


; External DLLs to load when the game starts.
; Paths may be relative to this configuration file or absolute.
; Without conditions, entries load after SteamAPI_Init.
; Conditions (early, data_ready and delay are mutually exclusive):
;   - early
;   - data_ready       load once every game param has been read
;   - delay,milliseconds
;   - after,name
[dll]
;seamlesscoop=SeamlessCoop/ersc.dll
;early_native=native1.dll|early
;delay_native=native2.dll|delay,5000
;after_native=native3.dll|after,delay_native
;param_native=native4.dll|data_ready


; Mod directories to scan and override game data.
; Later entries override earlier entries when they contain the same file.
; Paths may be relative to this configuration file or absolute.
[mod]
;mod1=mod
;mod2=C:\mymods\some_mod
